<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot Tạo Ảnh</title>
    <!-- Tích hợp Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Tùy chỉnh thanh cuộn cho giao diện tối */
        #chat-messages::-webkit-scrollbar {
            width: 8px;
        }
        #chat-messages::-webkit-scrollbar-track {
            background: #1f2937; /* bg-gray-800 */
        }
        #chat-messages::-webkit-scrollbar-thumb {
            background: #4b5563; /* bg-gray-600 */
            border-radius: 4px;
        }
        #chat-messages::-webkit-scrollbar-thumb:hover {
            background: #6b7280; /* bg-gray-500 */
        }
        /* Hiệu ứng gõ phím */
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #9ca3af; /* text-gray-400 */
            animation: bounce 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(2) {
            animation-delay: -0.32s;
        }
        .typing-indicator span:nth-child(3) {
            animation-delay: -0.16s;
        }
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1.0); }
        }
        .message-image {
            max-width: 100%;
            border-radius: 1rem;
        }
    </style>
</head>
<body class="bg-gray-900 font-sans flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-gray-800 rounded-2xl shadow-2xl flex flex-col h-[80vh]">
        <!-- Header -->
        <div class="bg-gray-900 text-white p-4 rounded-t-2xl flex items-center shadow-lg border-b border-gray-700">
            <div class="w-12 h-12 bg-indigo-600 rounded-full flex items-center justify-center mr-4 ring-2 ring-indigo-500">
                 <!-- Biểu tượng Bot SVG -->
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M12 6V3m0 18v-3M5.636 5.636L4.222 4.222m15.556 15.556L18.364 18.364M18.364 5.636L19.778 4.222m-15.556 15.556L5.636 18.364M12 16a4 4 0 100-8 4 4 0 000 8z"></path></svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-gray-100">AI Chatbot Sáng Tạo</h1>
                <p class="text-sm text-green-400">Đang hoạt động</p>
            </div>
        </div>

        <!-- Khung Chat -->
        <div id="chat-messages" class="flex-1 p-6 overflow-y-auto bg-gray-800">
            <!-- Tin nhắn sẽ được thêm vào đây -->
        </div>

        <!-- Khung nhập liệu -->
        <div class="p-4 bg-gray-900 border-t border-gray-700 rounded-b-2xl">
            <div class="flex items-center space-x-3">
                <input type="text" id="user-input" placeholder="Nhập tin nhắn hoặc yêu cầu vẽ..." class="flex-1 p-3 bg-gray-700 text-gray-200 border border-gray-600 rounded-full focus:outline-none focus:ring-2 focus:ring-indigo-500 transition placeholder-gray-400" disabled>
                <button id="send-btn" class="bg-indigo-600 text-white rounded-full p-3 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-gray-900 transition transform hover:scale-105" disabled>
                    <!-- Biểu tượng Gửi SVG -->
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        
        // Cải tiến: Khai báo các biến để quản lý người dùng và lịch sử chat
        let userId;
        let chatHistory = [];

        const API_KEY = "AIzaSyBxbfi4h-fJMy1W7RcoLepJmHgmaBLKaMo";
        const TEXT_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-05-20:generateContent?key=${API_KEY}`;
        const IMAGE_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${API_KEY}`;

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

        // Cải tiến: Các hàm để lưu, tải và hiển thị lại lịch sử chat
        function saveChatHistory() {
            if (userId) {
                localStorage.setItem(`chatHistory_${userId}`, JSON.stringify(chatHistory));
            }
        }

        function loadChatHistory() {
            if (userId) {
                const savedHistory = localStorage.getItem(`chatHistory_${userId}`);
                chatHistory = savedHistory ? JSON.parse(savedHistory) : [];
            }
        }

        function renderChatHistory() {
            chatMessages.innerHTML = '';
            chatHistory.forEach(msg => {
                const sender = msg.role === 'user' ? 'user' : 'bot';
                // Xử lý cả tin nhắn văn bản và hình ảnh khi tải lại
                const textPart = msg.parts.find(p => p.text);
                const imagePart = msg.parts.find(p => p.inlineData);
                let content = '';

                if (textPart) {
                    content = textPart.text;
                } else if (imagePart) {
                    content = `data:image/png;base64,${imagePart.inlineData.data}`;
                }
                
                if (content) {
                    addMessage(content, sender);
                }
            });
        }


        function addMessage(content, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `flex mb-4 ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
            const messageBubble = document.createElement('div');
            messageBubble.className = `max-w-xs lg:max-w-md px-4 py-3 rounded-2xl ${
                sender === 'user' ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-gray-700 text-gray-200 rounded-bl-none'
            }`;
            if (content.startsWith('data:image/')) {
                 messageBubble.innerHTML = `<img src="${content}" alt="Generated Image" class="message-image">`;
                 messageBubble.classList.remove('px-4', 'py-3');
            } else {
                messageBubble.textContent = content;
            }
            messageDiv.appendChild(messageBubble);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTypingIndicator(text = "") {
            const typingDiv = document.createElement('div');
            typingDiv.id = 'typing-indicator';
            typingDiv.className = 'flex justify-start mb-4';
            typingDiv.innerHTML = `
                <div class="bg-gray-700 px-4 py-3 rounded-2xl rounded-bl-none">
                    ${text ? `<p class="text-sm text-gray-400 mb-1">${text}</p>` : ''}
                    <div class="typing-indicator"><span></span><span></span><span></span></div>
                </div>`;
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTypingIndicator() {
            const indicator = document.getElementById('typing-indicator');
            if (indicator) indicator.remove();
        }
        
        async function fetchWithRetry(url, payload, maxRetries = 3) {
            let lastError;
            for (let i = 0; i < maxRetries; i++) {
                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (response.ok) return await response.json();
                    if (response.status === 429) {
                        const delay = Math.pow(2, i) * 1000 + Math.random() * 1000;
                        console.warn(`Rate limited. Retrying in ${delay.toFixed(0)}ms...`);
                        await sleep(delay);
                        lastError = new Error(`API_RATE_LIMITED`);
                        continue; 
                    }
                    lastError = new Error(`Lỗi API: ${response.status}`);
                    break; 
                } catch (error) { lastError = error; }
            }
            throw lastError;
        }

        async function generateImage(prompt) {
            try {
                const payload = {
                    contents: [{ parts: [{ text: `Một bức ảnh chất lượng cao, siêu thực về: ${prompt}` }] }],
                    generationConfig: { responseModalities: ['IMAGE'] },
                };
                const result = await fetchWithRetry(IMAGE_API_URL, payload);
                const content = result?.candidates?.[0]?.content;
                if (content && content.parts?.find(p => p.inlineData)) {
                    return { success: true, content: content };
                }
                return { success: false, message: "Xin lỗi, không thể tạo ảnh. Phản hồi API không chứa dữ liệu hình ảnh." };
            } catch (error) {
                console.error("Lỗi khi tạo ảnh:", error);
                if (error.message === 'API_RATE_LIMITED') return { success: false, message: "Tôi đang nhận được quá nhiều yêu cầu tạo ảnh. Vui lòng thử lại sau vài phút nhé." };
                return { success: false, message: `Rất tiếc, đã có lỗi khi tạo ảnh. (${error.message})` };
            }
        }
        
        async function getAIResponse(currentHistory) {
            try {
                const payload = {
                    contents: currentHistory,
                    systemInstruction: { parts: [{ text: "Bạn là một trợ lý chatbot thân thiện và hữu ích. Hãy trả lời một cách ngắn gọn và tự nhiên." }] },
                };
                const result = await fetchWithRetry(TEXT_API_URL, payload);
                const content = result.candidates?.[0]?.content;
                if (content && content.parts?.[0]?.text) {
                    return { success: true, content: content };
                }
                return { success: false, message: "Xin lỗi, tôi không thể tạo ra phản hồi lúc này." };
            } catch (error) {
                console.error("Lỗi khi gọi API văn bản:", error);
                if (error.message === 'API_RATE_LIMITED') return { success: false, message: "Tôi đang nhận được quá nhiều yêu cầu. Vui lòng thử lại sau giây lát." };
                return { success: false, message: `Rất tiếc, đã có lỗi xảy ra. (${error.message})` };
            }
        }

        async function handleUserMessage() {
            const message = userInput.value.trim();
            if (message === '') return;
            addMessage(message, 'user');

            // Cải tiến: Quản lý lịch sử chat tập trung
            chatHistory.push({ role: "user", parts: [{ text: message }] });
            saveChatHistory();

            userInput.value = '';
            userInput.disabled = true;
            sendBtn.disabled = true;

            const imageKeywords = ['vẽ', 'tạo ảnh', 'generate', 'draw', 'hãy vẽ', 'vẽ cho tôi'];
            const isImageRequest = imageKeywords.some(keyword => message.toLowerCase().startsWith(keyword));

            let result;
            let botResponseForUI;

            if (isImageRequest) {
                const prompt = message.replace(new RegExp(imageKeywords.join('|'), 'i'), '').trim();
                showTypingIndicator('Đang vẽ, chờ chút nhé...');
                result = await generateImage(prompt);
                if(result.success) {
                    const base64Data = result.content.parts.find(p => p.inlineData).inlineData.data;
                    botResponseForUI = `data:image/png;base64,${base64Data}`;
                }
            } else {
                showTypingIndicator();
                result = await getAIResponse([...chatHistory]);
                if(result.success) {
                    botResponseForUI = result.content.parts[0].text;
                }
            }
            
            hideTypingIndicator();

            if (result && result.success) {
                chatHistory.push(result.content);
                saveChatHistory();
                addMessage(botResponseForUI, 'bot');
            } else {
                chatHistory.pop(); // Xóa tin nhắn của người dùng nếu yêu cầu thất bại
                saveChatHistory();
                addMessage(result ? result.message : "Đã xảy ra lỗi không xác định.", 'bot');
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener('click', handleUserMessage);
        userInput.addEventListener('keyup', (event) => {
            if (event.key === 'Enter') handleUserMessage();
        });

        // Cải tiến: Khởi tạo ứng dụng khi trang được tải
        window.addEventListener('load', () => {
            // 1. Lấy hoặc tạo ID người dùng
            userId = localStorage.getItem('chatbotUserId');
            if (!userId) {
                userId = crypto.randomUUID();
                localStorage.setItem('chatbotUserId', userId);
            }
            
            // 2. Tải và hiển thị lịch sử chat của người dùng này
            loadChatHistory();
            renderChatHistory();

            // 3. Hiển thị tin nhắn chào mừng nếu là lần đầu
            if (chatHistory.length === 0) {
                 addMessage('Xin chào! Tôi có thể trò chuyện hoặc vẽ ảnh cho bạn. Bạn muốn bắt đầu với điều gì?', 'bot');
            }

            userInput.disabled = false;
            sendBtn.disabled = false;
        });
    </script>
</body>
</html>
